{% extends "network/layout.html" %}
{% load static %}

{% block script %}
    <script src="{% static 'network/index.js' %}"></script>
{% endblock %}

{% block body %}
    <h2 id="page-title"></h2>

    {% if user.is_authenticated %}
        <div id="create-post-container" class="card mb-4 shadow-sm" style="display: none;"> 
            <div class="card-header bg-light">
                <h4 class="mb-0">New Post</h4>
            </div>
            
            <div class="card-body">
                <form id="create-form">
                    <textarea 
                        class="form-control mb-3" 
                        id="create-content" 
                        placeholder="What's on your mind, {{ user.username }}?"
                        rows="3"
                    ></textarea>
                    <input 
                        type="submit" 
                        class="btn btn-primary btn-block" 
                        value="Post"
                    />
                </form>
            </div>
        </div>
    {% endif %}

    <div id="post-view"></div>
    <div id="pagination-controls" class="mt-3"></div>
    <div id="profile-view"></div>

{% endblock %}
